{% set name = "PyDispatcher" %}
{% set version = "2.0.5" %}
{% set sha256 = "5570069e1b1769af1fe481de6dd1d3a388492acddd2cdad7a3bde145615d5caf" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - pydispatch

about:
  home: http://pydispatcher.sourceforge.net
  license: BSD 3-Clause
  license_family: BSD
  license_file: license.txt
  summary: 'Multi-producer-multi-consumer signal dispatching mechanism'

  description: |
    Multi-producer-multi-consumer signal dispatching mechanism
  doc_url: http://pydispatcher.sourceforge.net/
  dev_url: http://pydispatcher.sourceforge.net/

extra:
  recipe-maintainers:
    - shyuep
